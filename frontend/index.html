<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kabithu Gold Finance</title>
<meta name="description" content="Kabithu Gold Finance — gold loans built on trust. Trust in Gold, Trust in Us." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=DM+Mono:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<style>
/* ===== tokens ===== */
:root{
  --ink:#03080f;
  --navy:#061426;
  --gold:#d9a63c;
  --gold-lt:#ffeab4;
  --bone:#f1e9dc;
  --line:rgba(217,166,60,.26);
  --serif:'Cinzel',serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --sans:'Jost',system-ui,sans-serif;
  --ease:cubic-bezier(.18,.86,.22,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--bone);overflow:hidden;
  background:
    radial-gradient(1000px 620px at 50% 38%,rgba(217,166,60,.10),transparent 66%),
    radial-gradient(900px 700px at 50% 120%,rgba(6,20,38,.95),transparent 70%),
    var(--ink);
}
img{display:block;max-width:100%}

/* ===== living gold field (blinks + drifts behind everything) ===== */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* rotating ray fan */
.rays{
  position:absolute;top:46%;left:50%;width:170vmax;aspect-ratio:1;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,
    transparent 0 5deg, rgba(217,166,60,.16) 5deg 6deg, transparent 6deg 16deg);
  animation:turn 120s linear infinite, flick 6s ease-in-out infinite;
  mask:radial-gradient(circle,rgba(0,0,0,.9) 8%,transparent 58%);
}
@keyframes turn{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes flick{0%,100%{opacity:.35}42%{opacity:.9}55%{opacity:.5}70%{opacity:.95}}
/* reflected sheen that sweeps left to right, like light off metal */
.sheen{
  position:absolute;top:0;bottom:0;width:46vw;left:-60vw;
  background:linear-gradient(100deg,transparent,rgba(255,234,180,.13) 45%,rgba(255,255,255,.05) 55%,transparent);
  transform:skewX(-14deg);animation:sweep 9s var(--ease) infinite;
}
@keyframes sweep{0%{left:-60vw}55%,100%{left:120vw}}

/* ===== top-right nav pills ===== */
.tabs{
  position:fixed;top:0;right:0;z-index:5;
  display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:0;
  padding:clamp(12px,2.2vw,22px) clamp(14px,2.8vw,36px);
}
.tabs a{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:10px clamp(12px,1.4vw,20px);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(241,233,220,.65);text-decoration:none;
  transition:color .45s var(--ease),background .45s var(--ease);
}
.tabs a::after{
  content:"";position:absolute;left:10%;right:10%;bottom:4px;height:1px;background:var(--gold);
  transform:scaleX(0);transform-origin:center;transition:transform .45s var(--ease);
}
.tabs a:hover,.tabs a.on{color:var(--gold-lt);background:rgba(217,166,60,.08)}
.tabs a:hover::after,.tabs a.on::after{transform:scaleX(1)}

/* ===== stage ===== */
.stage{
  position:relative;z-index:2;height:100%;
  padding:clamp(72px,9vw,120px) clamp(18px,4vw,56px) clamp(22px,4vw,44px);
  display:grid;grid-template-columns:1fr minmax(280px,1.5fr) 1fr;align-items:end;
  gap:clamp(6px,2vw,26px);
}

/* idols — exact same rendered width & height */
.idol{
  position:relative;display:flex;align-items:flex-end;justify-content:center;
  width:min(22vw,320px);height:min(68vh,640px);
}
.idol img{
  width:100%;height:100%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 24px 44px rgba(0,0,0,.72))
}
.halo{
  position:absolute;z-index:-1;inset:8% -10% 4%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,234,180,.34),rgba(217,166,60,.14) 42%,transparent 68%);
  animation:hb 5.4s ease-in-out infinite;
}
.idol:last-of-type .halo{animation-delay:-2.7s}
@keyframes hb{0%,100%{transform:scale(.94);opacity:.5}50%{transform:scale(1.1);opacity:1}}
/* thin gold arc ring that rotates around each idol */
.ring{
  position:absolute;z-index:-1;inset:15% -6% 6%;border-radius:50%;
  border:1px solid rgba(217,166,60,.3);border-left-color:transparent;border-bottom-color:transparent;
  animation:turn 26s linear infinite;
}

/* centre wordmark */
.word{text-align:center;align-self:center}
.top{
  font-family:var(--mono);font-size:10px;letter-spacing:.46em;text-transform:uppercase;color:var(--gold);
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.top::before,.top::after{content:"";height:1px;width:38px;background:var(--gold);opacity:.55}
.word h1{
  margin:18px 0 0;font-family:var(--serif);font-weight:900;line-height:.94;
  font-size:clamp(34px,5.4vw,76px);letter-spacing:.04em;
  padding:0 .06em .06em;
  background:linear-gradient(100deg,#d3a94f 0%,#f0d492 20%,#fff8e4 33%,#efd28c 46%,#c99a3c 66%,#f2d795 86%,#d3a94f 100%);
  background-size:220% 100%;background-position:0 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 9s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:0 0}50%{background-position:100% 0}100%{background-position:0 0}}
.word h2{
  margin:8px 0 0;font-family:var(--serif);font-weight:500;letter-spacing:.2em;
  font-size:clamp(15px,2.4vw,30px);color:var(--gold-lt);opacity:.92;
}
.tamil{margin:16px 0 0;font-size:clamp(12px,1.6vw,17px);letter-spacing:.06em;color:rgba(255,234,180,.78)}
.hr{margin:22px auto 0;width:min(300px,66%);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.say{
  margin:20px auto 0;max-width:46ch;font-size:clamp(13px,1.6vw,16.5px);line-height:1.85;
  color:rgba(241,233,220,.66);
}
.say b{color:var(--gold-lt);font-weight:400}

/* base line */
.base{
  position:fixed;left:0;right:0;bottom:0;z-index:4;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:12px clamp(18px,4vw,56px);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(217,166,60,.75);
}

@media(max-width:860px){
  body{overflow:auto}
  .stage{height:auto;min-height:100%;grid-template-columns:1fr 1fr;grid-template-areas:"a b" "w w";
    padding:96px 18px 74px;align-content:center;row-gap:22px}
  .idol{width:min(42vw,220px);height:min(34vh,280px);margin:0 auto}
  .idol:first-of-type{grid-area:a}.idol:last-of-type{grid-area:b}.word{grid-area:w}
  .tabs{position:fixed;top:0;left:0;right:0;justify-content:space-around;
    padding:10px 6px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(3,8,15,.92),rgba(6,20,38,.88))}
  .tabs a{padding:10px 8px;font-size:9px;letter-spacing:.12em}
  .tabs a::after{left:8%;right:8%}
  .base{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="field">
  <div class="rays"></div>
  <div class="sheen"></div>
</div>

<nav class="tabs">
  <a class="on" href="#">Home</a>
  <a href="#">About&nbsp;Us</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
  <a href="login.html">Sign&nbsp;In</a>
</nav>

<main class="stage">
  <figure class="idol">
    <div class="halo"></div><div class="ring"></div>
    <img src="images/murugan.png" alt="Lord Murugan" />
  </figure>

  <div class="word">
    <div class="top">Welcome</div>
    <h1>KABITHU</h1>
    <h2>GOLD FINANCE</h2>
    <div class="tamil">கபிது கோல்ட் ஃபைனான்ஸ்</div>
    <div class="hr"></div>
    <p class="say">Your gold, our responsibility. Your trust, our promise.<br>உங்கள் பொன் எங்கள் பொறுப்பு, உங்கள் நம்பிக்கை எங்கள் வாக்குறுதி.</p>
  </div>

  <figure class="idol">
    <div class="halo"></div><div class="ring"></div>
    <img src="images/ganesha.png" alt="Lord Ganesha" />
  </figure>
</main>

<div class="base">
  <span>Kabithu Gold Finance</span>
  <span>Trust in Gold, Trust in Us</span>
</div>

<script>
  // active tab highlight
  document.querySelectorAll('.tabs a').forEach(a=>a.addEventListener('click',e=>{
    document.querySelectorAll('.tabs a').forEach(x=>x.classList.remove('on'));
    a.classList.add('on');
  }));

  // gold reflection follows the pointer across the stage
  const field=document.querySelector('.field');
  addEventListener('pointermove',e=>{
    const x=(e.clientX/innerWidth-.5), y=(e.clientY/innerHeight-.5);
    field.style.transform=`translate(${x*-18}px,${y*-14}px)`;
  },{passive:true});
</script>
</body>
</html>
