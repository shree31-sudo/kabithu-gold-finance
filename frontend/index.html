<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabithu Gold Finance</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-blob blob-1" aria-hidden="true"></div>
<div class="bg-blob blob-2" aria-hidden="true"></div>

<main class="page">

  <div class="brandline">
    <svg class="brandline-badge" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="20" fill="none" stroke="#c89b3c" stroke-width="1.3"/>
      <circle cx="22" cy="22" r="15.5" fill="none" stroke="#c89b3c" stroke-width="0.8"/>
      <text x="22" y="29" text-anchor="middle" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#c89b3c">க</text>
    </svg>
    <span class="brandline-word">
      <strong>Kabithu Gold Finance</strong>
      <em>Pawn Shop</em>
    </span>
  </div>

  <div class="login-shell">

    <!-- ---------- Left: photo panel ---------- -->
    <div class="illustration-panel">
      <div class="illu-slideshow" id="illuSlideshow">
        <img
          class="illu-photo is-active"
          src="chain.png"
          alt="Gold bangles, chains and rings laid out on the shop counter"
          loading="eager"
        >
        <img
          class="illu-photo"
          src="pawn.png"
          alt="Illustration of a jewelry balance scale, used to appraise pledged gold"
          loading="lazy"
        >
        <img
          class="illu-photo"
          src="shop.png"
          alt="Illustration of stacked gold bangles"
          loading="lazy"
        >
        <img
          class="illu-photo"
          src="necklace.png"
          alt="Illustration of a gold necklace with pendant, the kind of pledge Kabithu Gold Finance appraises every day"
          loading="lazy"
        >
        <img
          class="illu-photo"
          src="bracelet.jpg"
          alt="Illustration of an open ledger book with handwritten entries and a pen"
          loading="lazy"
        >
      </div>
      <div class="illu-grain" aria-hidden="true"></div>
      <div class="illu-vignette" aria-hidden="true"></div>

      <!-- brass pledge-stamp, the shop's mark on every ticket -->
      <div class="pledge-stamp" aria-hidden="true">
        <svg viewBox="0 0 140 140">
          <defs>
            <path id="stampCircle" d="M 70,70 m -54,0 a 54,54 0 1,1 108,0 a 54,54 0 1,1 -108,0"/>
          </defs>
          <circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-width="1"/>
          <circle cx="70" cy="70" r="54" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="70" cy="70" r="40" fill="none" stroke="currentColor" stroke-width="0.8"/>
          <text font-size="10.4" letter-spacing="2.6" fill="currentColor">
            <textPath href="#stampCircle" startOffset="3%">KABITHU GOLD FINANCE &#9670; PAWN SHOP &#9670;</textPath>
          </text>
          <text x="70" y="66" text-anchor="middle" font-family="'Fraunces', serif" font-size="26" font-weight="600" fill="currentColor">க</text>
          <text x="70" y="86" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" letter-spacing="1.5" fill="currentColor">EST. TRUST</text>
        </svg>
      </div>

      <div class="illu-dots" id="illuDots" role="tablist" aria-label="Shop photo slideshow"></div>

      <p class="illu-caption">Every item logged. Every loan tracked.</p>
    </div>

    <!-- ---------- Right: credentials panel ---------- -->
    <div class="form-panel">
      <div class="card-heading">
        <h1>Kabithu Gold Finance</h1>
        <p>Your Trusted Gold & Finance Management Platform.</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="field">
          <label for="role">Signing in as</label>
          <div class="input-icon-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <select id="role" name="role" required>
              <option value="" disabled selected>Select your role</option>
              <option value="Manager">Manager</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-icon-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 4h16v16H4z" opacity="0"/>
              <path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6z"/>
              <path d="m22 6-10 7L2 6"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="you@shop.com" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" class="pw-input" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-banner" id="errorBanner" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="errorText">Something went wrong.</span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="spinner"></span>
          <span class="submit-label">Sign In</span>
        </button>

      </form>

      <div class="card-footer">
        <p>Need access? Contact your shop manager.</p>
      </div>
    </div>

  </div>

  <p class="page-footer">&copy; 2026 Kabithu Gold Finance. All Rights Reserved.</p>
</main>

<script src="slideshow.js"></script>
<script src="js/login.js"></script>
</body>
</html>
